<body id="root"><main><h1>Mensaje desde 2126</h1><div id="wrap" class="game-player"><canvas id="game-screen" width="160" height="120"></canvas></div><p>Flechas: caminar · Z / espacio: A · X: B<br>Reparación: A → B → A → ↑ · ↓ cancela</p><button onclick="location.reload()">Volver al inicio</button> <a style="color:#a7e7d6;margin-left:16px" href="/proyecto.mkcd" download="Mensaje-desde-2126.mkcd">Descargar para MakeCode</a><p id="status">Cargando simulador local…</p></main>

<script src="/runtime.js"></script><script src="/arcade.js"></script>
<script>
(async()=>{try {
 const code=await (await fetch('/game.js')).text();
 const msg={type:'run',code,id:'local-preview',parts:[],partDefinitions:{},storedState:{},options:{},frameCounter:1};
 window.simulator=new pxsim.Runtime(msg);
 pxsim.Runtime.messagePosted=msg=>{if(msg.type==='debugger'&&msg.subtype==='warning')console.warn(msg);};
 await simulator.board.initAsync(msg);simulator.run();
 document.getElementById('status').textContent='Misión 1 jugable · Niveles 2–4: mapas para desarrollar';
}catch(e){document.getElementById('status').textContent=e.message;console.error(e.stack);}})();
</script></html>
